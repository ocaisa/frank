---
# NFS server on the head, NFS client on workers.
#
# The eessi user's home directory lives on the head's NFS export, so the same
# home content is visible from workers after /nfs/home is mounted.

- name: Install NFS server packages (head)
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: nfs_server_apt
  retries: 3
  delay: 5
  until: nfs_server_apt is succeeded
  when: is_head | default(false)

- name: Install NFS client packages (workers)
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: nfs_client_apt
  retries: 3
  delay: 5
  until: nfs_client_apt is succeeded
  when: not (is_head | default(false))

- name: Create NFS export directories (head)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nfs_export_root }}"
    - "{{ nfs_export_root }}/home"
    - /var/spool/slurm
  when: is_head | default(false)

- name: Ensure /etc/exports includes the exports.d directory (head)
  ansible.builtin.template:
    src: exports_main.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  when: is_head | default(false)
  notify: reload nfs-kernel-server

- name: Create NFS export configuration (head)
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports.d/eessi-cluster
    owner: root
    group: root
    mode: "0644"
  when: is_head | default(false)
  notify: reload nfs-kernel-server

- name: Ensure NFS server is enabled and running (head)
  ansible.builtin.service:
    name: nfs-kernel-server
    state: started
    enabled: true
  when: is_head | default(false)

- name: Create worker NFS mount points
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /nfs/home
    - /var/spool/slurm
  when: not (is_head | default(false))

- name: Mount the eessi home export on workers
  ansible.builtin.mount:
    path: /nfs/home
    src: "{{ head_hostname }}:{{ nfs_export_root }}/home"
    fstype: "{{ nfs_version }}"
    opts: "defaults,_netdev"
    state: mounted
    boot: yes
  when: not (is_head | default(false))

- name: Mount the shared Slurm spool on workers
  ansible.builtin.mount:
    path: /var/spool/slurm
    src: "{{ head_hostname }}:/var/spool/slurm"
    fstype: "{{ nfs_version }}"
    opts: "defaults,_netdev"
    state: mounted
    boot: yes
  when: not (is_head | default(false))

- name: Ensure the eessi group exists
  ansible.builtin.group:
    name: "{{ eessi_group }}"
    state: present
    gid: "{{ eessi_gid }}"

- name: Ensure the eessi user exists
  ansible.builtin.user:
    name: "{{ eessi_user }}"
    group: "{{ eessi_group }}"
    uid: "{{ eessi_uid }}"
    home: "{{ eessi_home }}"
    shell: "{{ eessi_shell }}"
    password: "{{ eessi_password | password_hash('sha512') }}"
    createhome: true
    update_password: always

- name: Ensure the eessi user can authenticate with munge
  ansible.builtin.user:
    name: "{{ eessi_user }}"
    groups: munge
    append: true

# The user module only sets the home at creation time; point an existing
# eessi account at the shared NFS home.
- name: Check the current eessi home directory
  ansible.builtin.command: getent passwd "{{ eessi_user }}"
  register: eessi_passwd
  changed_when: false

- name: Point an existing eessi user at the shared NFS home
  ansible.builtin.command: usermod -d "{{ eessi_home }}" "{{ eessi_user }}"
  when: eessi_passwd.stdout.split(':')[5] != eessi_home

- name: Ensure the eessi home directory is owned by eessi (head)
  ansible.builtin.file:
    path: "{{ eessi_home }}"
    state: directory
    owner: "{{ eessi_user }}"
    group: "{{ eessi_group }}"
    mode: "0750"
  when: is_head | default(false)

# Re-apply ownership recursively in case the eessi UID changed since the home
# was first populated (the user module does not chown existing files).
- name: Ensure the eessi home content is owned by eessi (head)
  ansible.builtin.file:
    path: "{{ eessi_home }}"
    owner: "{{ eessi_user }}"
    group: "{{ eessi_group }}"
    recurse: true
  when: is_head | default(false)

- name: Install the eessi shell profile with EESSI activation
  ansible.builtin.template:
    src: eessi_bashrc.j2
    dest: "{{ eessi_home }}/.bashrc"
    owner: "{{ eessi_user }}"
    group: "{{ eessi_group }}"
    mode: "0644"
