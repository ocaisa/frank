---
# NFS server on the head, NFS client on workers.
#
# The eessi user's home directory lives on the head's NFS export, so the same
# home content is visible from workers after /nfs/home is mounted.

- name: Install NFS server packages (head)
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: nfs_server_apt
  retries: 3
  delay: 5
  until: nfs_server_apt is succeeded
  when: is_head | default(false)

- name: Install NFS client packages (workers)
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: nfs_client_apt
  retries: 3
  delay: 5
  until: nfs_client_apt is succeeded
  when: not (is_head | default(false))

- name: Create NFS export directories (head)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nfs_export_root }}"
    - "{{ nfs_export_root }}/home"
    - /var/spool/slurm
  when: is_head | default(false)

- name: Create the NFS export configuration (head)
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  when: is_head | default(false)

- name: Ensure NFS server is enabled and running (head)
  ansible.builtin.service:
    name: nfs-kernel-server
    state: started
    enabled: true
  when: is_head | default(false)

- name: Load the NFS exports into the running kernel (head)
  ansible.builtin.command: exportfs -ra
  changed_when: false
  when: is_head | default(false)

- name: Create worker NFS mount points
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /nfs/home
    - /var/spool/slurm
  when: not (is_head | default(false))

- name: Mount the eessi home export on workers
  ansible.builtin.mount:
    path: /nfs/home
    src: "{{ head_hostname }}:{{ nfs_export_root }}/home"
    fstype: "{{ nfs_version }}"
    opts: "defaults,_netdev"
    state: mounted
    boot: yes
  when: not (is_head | default(false))

- name: Mount the shared Slurm spool on workers
  ansible.builtin.mount:
    path: /var/spool/slurm
    src: "{{ head_hostname }}:/var/spool/slurm"
    fstype: "{{ nfs_version }}"
    opts: "defaults,_netdev"
    state: mounted
    boot: yes
  when: not (is_head | default(false))

# Stop a worker here instead of plowing on with a missing mount: everything
# below (shared home, eessi user, Slurm spool) depends on these mounts.
- name: Verify the shared eessi home is reachable (workers)
  ansible.builtin.stat:
    path: "{{ eessi_home }}"
  register: worker_eessi_home
  when: not (is_head | default(false))

- name: Fail if the eessi home is not visible through NFS (workers)
  ansible.builtin.assert:
    that:
      - worker_eessi_home.stat.exists
    fail_msg: >-
      {{ eessi_home }} is not visible on this worker. The NFS mount of
      {{ head_hostname }}:{{ nfs_export_root }}/home at /nfs/home is missing
      or stale; check the head's export table (exportfs -v) and the worker's
      nfs client before re-running.
  when: not (is_head | default(false))

# The head is canonical for the eessi account's UID/GID (NFS with
# no_root_squash checks raw UIDs). The head publishes them to the control
# node and workers adopt them, mirroring the munge key flow.
- name: Ensure the canonical eessi IDs exist on the control node
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/keys/eessi.ids"
  delegate_to: localhost
  become: false
  register: control_eessi_ids
  when: not (is_head | default(false))

- name: Fail if the head eessi IDs have not been published yet
  ansible.builtin.assert:
    that:
      - control_eessi_ids.stat.exists
    fail_msg: >-
      {{ playbook_dir }}/keys/eessi.ids is missing. Run the head_node play
      first so the head's eessi UID/GID can be published before configuring
      workers.
  when: not (is_head | default(false))

- name: Read the head's eessi UID/GID from the control node
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/keys/eessi.ids"
  delegate_to: localhost
  become: true
  register: eessi_ids_staged
  when: not (is_head | default(false))

- name: Adopt the head's eessi UID/GID
  ansible.builtin.set_fact:
    eessi_uid: "{{ (eessi_ids_staged.content | b64decode).split()[0] | int }}"
    eessi_gid: "{{ (eessi_ids_staged.content | b64decode).split()[1] | int }}"
  when: not (is_head | default(false))

- name: Ensure the eessi group exists
  ansible.builtin.group:
    name: "{{ eessi_group }}"
    state: present
    gid: "{{ eessi_gid | default(omit) }}"

# Head: the home is a local directory (it is the export root). Workers must
# NOT create it locally: the shared home arrives via the NFS mount (verified
# above), and a local directory would silently diverge from the head's.
- name: Ensure the eessi user exists (head)
  ansible.builtin.user:
    name: "{{ eessi_user }}"
    group: "{{ eessi_group }}"
    uid: "{{ eessi_uid | default(omit) }}"
    home: "{{ eessi_home }}"
    shell: "{{ eessi_shell }}"
    password: "{{ eessi_password | password_hash('sha512') }}"
    createhome: true
    update_password: always
  when: is_head | default(false)

- name: Ensure the eessi user exists (workers)
  ansible.builtin.user:
    name: "{{ eessi_user }}"
    group: "{{ eessi_group }}"
    uid: "{{ eessi_uid | default(omit) }}"
    home: "{{ eessi_home }}"
    shell: "{{ eessi_shell }}"
    password: "{{ eessi_password | password_hash('sha512') }}"
    update_password: always
  when: not (is_head | default(false))

- name: Ensure the eessi user can authenticate with munge
  ansible.builtin.user:
    name: "{{ eessi_user }}"
    groups: munge
    append: true

# The user module only sets the home at creation time; point an existing
# eessi account at the shared NFS home.
- name: Check the current eessi home directory
  ansible.builtin.command: getent passwd "{{ eessi_user }}"
  register: eessi_passwd
  changed_when: false

- name: Publish the head's eessi UID/GID to the control node
  ansible.builtin.copy:
    content: "{{ eessi_passwd.stdout.split(':')[2] }} {{ eessi_passwd.stdout.split(':')[3] }}\n"
    dest: "{{ playbook_dir }}/keys/eessi.ids"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: is_head | default(false)

- name: Point an existing eessi user at the shared NFS home
  ansible.builtin.command: usermod -d "{{ eessi_home }}" "{{ eessi_user }}"
  when: eessi_passwd.stdout.split(':')[5] != eessi_home

- name: Ensure the eessi home directory is owned by eessi (head)
  ansible.builtin.file:
    path: "{{ eessi_home }}"
    state: directory
    owner: "{{ eessi_user }}"
    group: "{{ eessi_group }}"
    mode: "0750"
  when: is_head | default(false)

# Re-apply ownership recursively in case the eessi UID changed since the home
# was first populated (the user module does not chown existing files).
- name: Ensure the eessi home content is owned by eessi (head)
  ansible.builtin.file:
    path: "{{ eessi_home }}"
    owner: "{{ eessi_user }}"
    group: "{{ eessi_group }}"
    recurse: true
  when: is_head | default(false)

# The head is the only writer: the home is shared over NFS, so workers pick
# the file up from the mount. Writing it back through NFS races the head and
# fails with permission denied when the running export squashes root.
- name: Install the eessi shell profile with EESSI activation (head)
  ansible.builtin.template:
    src: eessi_bashrc.j2
    dest: "{{ eessi_home }}/.bashrc"
    owner: "{{ eessi_user }}"
    group: "{{ eessi_group }}"
    mode: "0644"
  when: is_head | default(false)
