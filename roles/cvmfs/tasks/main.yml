---
# CVMFS client + EESSI repositories.
#
# CVMFS is installed via the official CERN cvmfs-release .deb, which
# configures the CVMFS apt repository for us.

- name: Install CVMFS prerequisites
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: cvmfs_prereq_apt
  retries: 3
  delay: 5
  until: cvmfs_prereq_apt is succeeded

- name: Download the CVMFS release package
  ansible.builtin.get_url:
    url: https://ecsft.cern.ch/dist/cvmfs/cvmfs-release/cvmfs-release-latest_all.deb
    dest: /tmp/cvmfs-release-latest_all.deb
    owner: root
    group: root
    mode: "0644"
    use_proxy: "{{ use_proxy | default(false) | ternary('yes', 'no') }}"
  register: cvmfs_release_deb
  retries: 3
  delay: 5
  until: cvmfs_release_deb is succeeded
  environment: "{{ proxy_env if use_proxy | default(false) else {} }}"

- name: Install the CVMFS release package
  ansible.builtin.apt:
    deb: /tmp/cvmfs-release-latest_all.deb
    state: present
    cache_valid_time: 3600
  register: cvmfs_release_install
  retries: 3
  delay: 5
  until: cvmfs_release_install is succeeded

- name: Remove the CVMFS release package
  ansible.builtin.file:
    path: /tmp/cvmfs-release-latest_all.deb
    state: absent

- name: Download the EESSI CVMFS configuration package
  ansible.builtin.get_url:
    url: https://github.com/EESSI/filesystem-layer/releases/download/latest/cvmfs-config-eessi_latest_all.deb
    dest: /tmp/eessi-cvmfs-release-latest_all.deb
    owner: root
    group: root
    mode: "0644"
    use_proxy: "{{ use_proxy | default(false) | ternary('yes', 'no') }}"
  register: eessi_release_deb
  retries: 3
  delay: 5
  until: eessi_release_deb is succeeded
  environment: "{{ proxy_env if use_proxy | default(false) else {} }}"

- name: Install the EESSI config package
  ansible.builtin.apt:
    deb: /tmp/eessi-cvmfs-release-latest_all.deb
    state: present
    cache_valid_time: 3600
  register: eessi_release_install
  retries: 3
  delay: 5
  until: eessi_release_install is succeeded

- name: Remove the EESSI config package
  ansible.builtin.file:
    path: /tmp/eessi-cvmfs-release-latest_all.deb
    state: absent

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true

- name: Install the CVMFS client
  ansible.builtin.apt:
    name: cvmfs
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: cvmfs_apt
  retries: 3
  delay: 5
  until: cvmfs_apt is succeeded

- name: Configure CVMFS global settings
  ansible.builtin.template:
    src: default.local.j2
    dest: /etc/cvmfs/default.local
    owner: root
    group: root
    mode: "0644"
  notify: restart cvmfs

- name: Set up CVMFS
  ansible.builtin.command:
    cmd: cvmfs_config setup
  changed_when: false

- name: Probe EESSI CVMFS repository
  ansible.builtin.command:
    cmd: cvmfs_config probe software.eessi.io
  register: cvmfs_probe
  changed_when: false

