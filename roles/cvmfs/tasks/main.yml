---
# CVMFS client + EESSI repositories.
#
# CVMFS is installed via the official CERN cvmfs-release .deb, which
# configures the CVMFS apt repository for us.

- name: Install CVMFS prerequisites
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: cvmfs_prereq_apt
  retries: 3
  delay: 5
  until: cvmfs_prereq_apt is succeeded

- name: Download the CVMFS release package
  ansible.builtin.get_url:
    url: https://ecsft.cern.ch/dist/cvmfs/cvmfs-release/cvmfs-release-latest_all.deb
    dest: /tmp/cvmfs-release-latest_all.deb
    owner: root
    group: root
    mode: "0644"
    use_proxy: "{{ use_proxy | default(false) | ternary('yes', 'no') }}"
    proxy_env_variable: http_proxy
  register: cvmfs_release_deb
  retries: 3
  delay: 5
  until: cvmfs_release_deb is succeeded
  environment: "{{ proxy_env if use_proxy | default(false) else {} }}"

- name: Install the CVMFS release package
  ansible.builtin.apt:
    deb: /tmp/cvmfs-release-latest_all.deb
    state: present
    cache_valid_time: 3600
  register: cvmfs_release_install
  retries: 3
  delay: 5
  until: cvmfs_release_install is succeeded

- name: Remove the CVMFS release package
  ansible.builtin.file:
    path: /tmp/cvmfs-release-latest_all.deb
    state: absent

- name: Install the CVMFS client
  ansible.builtin.apt:
    name: cvmfs
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: cvmfs_apt
  retries: 3
  delay: 5
  until: cvmfs_apt is succeeded

- name: Add the EESSI CVMFS repositories
  ansible.builtin.command:
    cmd: "cvmfs_config add {{ item.name }}"
    creates: "/etc/cvmfs/repositories.d/{{ item.name }}.local"
  loop: "{{ cvmfs_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: cvmfs_add
  changed_when: cvmfs_add.rc == 0
  environment: "{{ proxy_env if use_proxy | default(false) else {} }}"

- name: Configure CVMFS global settings
  ansible.builtin.template:
    src: default.local.j2
    dest: /etc/cvmfs/default.local
    owner: root
    group: root
    mode: "0644"
  notify: restart cvmfs

- name: Discover CVMFS service units
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      find /etc/systemd/system /lib/systemd/system -maxdepth 1 -name 'cvmfs-*.service' -printf '%f\n' | sort -u
  args:
    executable: /bin/bash
  register: cvmfs_units_raw
  changed_when: false
  when: use_proxy | default(false)

- name: Configure CVMFS systemd proxy environment
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.d/proxy.conf"
    content: |
      [Service]
      {% for key, value in proxy_env.items() %}
      Environment="{{ key }}={{ value }}"
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cvmfs_units_raw.stdout_lines | default([]) }}"
  when: use_proxy | default(false)
  notify: restart cvmfs

- name: Ensure CVMFS repository services are enabled and running
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      systemctl daemon-reload
      shopt -s nullglob
      units=(cvmfs-*.service)
      if [ ${#units[@]} -gt 0 ]; then
        systemctl enable --now "${units[@]}"
      fi
  args:
    executable: /bin/bash
  changed_when: true
