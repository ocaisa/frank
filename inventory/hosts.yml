---
# Group membership + management IP only. Per-node details (MAC, CPU, GPU,
# per-node IP) live in inventory/host_vars/<node>.yml.
#
# Topology: 1 head (controller-only) + 4 workers = 5 nodes.
# One worker (worker04) has a Jetson Orin GPU, declared explicitly (no autodetect).
all:
  children:
    head_node:
      hosts:
        head01:
          ansible_host: localhost  # TODO: revert to 10.0.0.1 once the IP is assigned
    worker_nodes:
      hosts:
        worker01:
          ansible_host: 10.0.0.11
        worker02:
          ansible_host: 10.0.0.12
        worker03:
          ansible_host: 10.0.0.13
        worker04:
          ansible_host: 10.0.0.14
  vars:
    # --- cluster identity / network ---
    cluster_name: frank
    cluster_net: 10.0.0.0
    cluster_netmask: 255.255.255.0
    cluster_netmask_prefix: 24
    cluster_gw: 10.0.0.1          # = head eth0
    head_lan_iface: eth0
    head_lan_ip: 10.0.0.1/24
    uplink_iface: wlan0           # head's Wi-Fi interface (internet)

    # --- administration ---
    # All nodes are managed by the existing frank user using a passwordless SSH key.
    admin_user: frank
    admin_groups: sudo

    # --- head node (controller-only, Raspberry Pi 5 16GB) ---
    head_hostname: frank   # real hostname of the head machine (must match for slurmctld)
    head_board: "Raspberry Pi 5"
    head_arch: arm64
    head_cpus: 4
    head_cores: 4
    head_threads: 1
    head_memory: 16384            # MB (head is a controller-only node, not a slurmd node)

    # --- worker defaults (Raspberry Pi 5 8GB; override per host in host_vars) ---
    worker_default_board: "Raspberry Pi 5"
    worker_default_arch: arm64
    worker_default_cpus: 4
    worker_default_memory: 8192   # MB
    worker_default_core_count: 4
    worker_default_threads: 1

    # --- GPU / Slurm GRES ---
    # nvidia-smi may work on the Jetson Orin, but NVML/GPU autodetection is not assumed.
    gres_types: gpu
    gpu_auto_detect: false

    # --- eessi user ---
    eessi_user: eessi
    eessi_group: eessi
    eessi_password: EESSI
    eessi_shell: /bin/bash

    # --- NFS ---
    nfs_export_root: /nfs
    nfs_options: rw,sync,no_subtree_check,no_root_squash
    nfs_version: nfs4

    # --- Slurm ---
    slurm_user: slurm
    slurm_group: slurm
    slurm_uid: 1050
    slurm_gid: 1050
    slurm_state_dir: /var/spool/slurm
    slurmctld_port: 6817
    slurmd_port: 6818

    # --- proxy (squid on the head) ---
    squid_port: 3128
    squid_listen: 10.0.0.1
    squid_cache_dir: /var/spool/squid

    # --- CVMFS / EESSI ---
    cvmfs_repos:
      - name: software.eessi.io
        comment: EESSI software
    eessi_cvmfs_root: /cvmfs/software.eessi.io
    eessi_version: 2026.06
    eessi_init_lmod: "{{ eessi_cvmfs_root }}/versions/{{ eessi_version }}/init/lmod/bash"

    # --- shared /etc/hosts block (hostname -> lan IP) ---
    lan_hosts:
      - { name: "frank head01", ip: 10.0.0.1 }   # real hostname + alias (docs, clush, ssh)
      - { name: worker01, ip: 10.0.0.11 }
      - { name: worker02, ip: 10.0.0.12 }
      - { name: worker03, ip: 10.0.0.13 }
      - { name: worker04, ip: 10.0.0.14 }
