---
- name: restart cvmfs
  ansible.builtin.shell:
    cmd: |
      {% raw %}
      set -euo pipefail
      systemctl daemon-reload
      shopt -s nullglob
      units=(cvmfs-*.service)
      if [ ${#units[@]} -gt 0 ]; then
        systemctl restart "${units[@]}"
      fi
      {% endraw %}
  args:
    executable: /bin/bash
  changed_when: true
